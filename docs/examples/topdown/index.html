<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2D - Top-Down Example</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a2e;
    }

    #screen {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }

    /*
     * The engine letterboxes internally (it keeps the designed aspect ratio
     * and centres the world), so the canvas fills its box and CSS does not
     * scale it. Letting the element size itself from its width/height
     * attributes would feed back into the engine's resize observer, which
     * sets those attributes from the measured size.
     */
    .stage {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .keys {
      color: #eaeaea;
      font-size: 12px;
      margin-top: 10px;
      font-size: 1rem;
    }
  </style>
  <script type="module" crossorigin src="/m2d-engine/assets/topdown-DJC6Prxq.js"></script>
  <link rel="modulepreload" crossorigin href="/m2d-engine/assets/settingsMenu-BRSbyVHp.js">
  <link rel="modulepreload" crossorigin href="/m2d-engine/assets/preload-helper-NSRvbUIY.js">
  <link rel="modulepreload" crossorigin href="/m2d-engine/assets/entity-l-Ak0laZ.js">
  <link rel="modulepreload" crossorigin href="/m2d-engine/assets/keyboardControl-4d7Ic6_Y.js">
  <link rel="modulepreload" crossorigin href="/m2d-engine/assets/trigger-Cp_E4hVD.js">
</head>

<body>
  <div class="game-container">
    <div class="stage"><canvas id="screen" width="640" height="480"></canvas></div>
    <div class="keys">
      <b>Arrow Keys:</b> Move · <b>X:</b> Attack · <b>D:</b> Toggle Debug · <b>O:</b> Settings
    </div>
  </div>
</body>

</html>
