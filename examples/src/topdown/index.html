<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2D - Top-Down Example</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a2e;
    }

    #screen {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }

    /*
     * The engine letterboxes internally (it keeps the designed aspect ratio
     * and centres the world), so the canvas fills its box and CSS does not
     * scale it. Letting the element size itself from its width/height
     * attributes would feed back into the engine's resize observer, which
     * sets those attributes from the measured size.
     */
    .stage {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <div class="game-container">
    <div class="stage"><canvas id="screen" width="640" height="480"></canvas></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
