<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2D - Yard (3D)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d1117;
    }

    /*
     * The 3D renderer lays its HUD canvas over the world canvas with
     * absolute positioning, so the stage is positioned to be its
     * containing block.
     */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #screen {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* The loading plate: shown until the scene's models have arrived. */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #e6e1d6;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: radial-gradient(ellipse at center, #1a2230 0%, #0d1117 70%);
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    #loading.done {
      opacity: 0;
    }

    #loading .bar {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    #loading .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: #ffd58a;
      transition: width 0.25s ease;
    }

    #loading small {
      color: rgba(230, 225, 214, 0.55);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: none;
    }

    #unsupported {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: #c9d1d9;
      font-size: 18px;
      text-align: center;
      padding: 32px;
    }
  </style>
</head>

<body>
  <div class="stage">
    <canvas id="screen" width="1280" height="720"></canvas>
    <div id="loading">
      <div>The Yard</div>
      <div class="bar"><span></span></div>
      <small>Loading…</small>
    </div>
    <div id="unsupported"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
