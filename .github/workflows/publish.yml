name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('packages/engine/package.json'));
          const tag = process.env.RELEASE_TAG;
          if (tag && tag !== `v${version}`) throw new Error(`Release tag must be v${version}, got ${tag}`);
          if (version.includes('-') || process.env.IS_PRERELEASE === 'true') {
            throw new Error('This workflow publishes stable releases only.');
          }
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Publish package using trusted publishing
        run: npm publish --workspace=packages/engine --access public
