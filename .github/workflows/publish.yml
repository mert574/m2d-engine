name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The tests need the examples' assets: a cold cache builds the lot's
    # photoscans, which is the better part of an hour.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('packages/engine/package.json'));
          const tag = process.env.RELEASE_TAG;
          if (tag && tag !== `v${version}`) throw new Error(`Release tag must be v${version}, got ${tag}`);
          if (version.includes('-') || process.env.IS_PRERELEASE === 'true') {
            throw new Error('This workflow publishes stable releases only.');
          }
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install the software GPU drivers
        # The runner has no GPU, and npm test draws in Node on its CPU:
        # Mesa's lavapipe is the Vulkan device Dawn runs WebGPU on, and
        # llvmpipe the OpenGL one ANGLE runs WebGL2 on.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libgl1-mesa-dri libegl1

      - name: Build example assets
        uses: ./.github/actions/example-assets

      - name: Run tests
        run: npm test

      - name: Publish package using trusted publishing
        run: npm publish --workspace=packages/engine --access public

      - name: Publish the kit when its version is new
        run: |
          wanted="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/kit/package.json')).version")"
          if npm view "m2d-kit@$wanted" version >/dev/null 2>&1; then
            echo "m2d-kit@$wanted is already published"
          else
            npm publish --workspace=packages/kit --access public
          fi
