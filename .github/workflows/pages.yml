name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold asset cache fetches and compiles the lot's photoscans, which is
    # the better part of an hour; a warm one is minutes.
    timeout-minutes: 60
    # Manual runs must also publish the production branch.
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the software GPU drivers
        # The runner has no GPU, and npm test draws in Node on its CPU:
        # Mesa's lavapipe is the Vulkan device Dawn runs WebGPU on, and
        # llvmpipe the OpenGL one ANGLE runs WebGL2 on.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libgl1-mesa-dri libegl1

      - name: Build example assets
        uses: ./.github/actions/example-assets

      - name: Run tests
        run: npm test

      - name: Build site (docs + demos)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
