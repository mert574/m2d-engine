name: Build example assets
description: >
  Restores the examples' built assets from the cache and builds whatever is
  missing. The sprites, dev textures and the lot's Poly Haven models are
  fetched and compiled, never committed, so the tests and the site build
  need this step first.

runs:
  using: composite
  steps:
    # The built set, under a key of everything that decides it. A miss
    # restores the newest cache through the restore-key, and the build fills
    # in only what changed.
    - name: Name what is cached
      shell: bash
      run: |
        {
          echo 'BUILT_ASSETS<<EOF'
          echo 'examples/src/yard/models/ph'
          echo 'examples/src/yard/models/dev'
          echo 'examples/src/yard/textures'
          echo 'examples/src/yard/environments'
          echo 'examples/src/showcase/assets'
          echo 'examples/src/platformer/assets'
          echo 'EOF'
        } >> "$GITHUB_ENV"

    - name: Restore built example assets
      id: built
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.BUILT_ASSETS }}
        key: example-assets-${{ runner.os }}-${{ hashFiles('examples/scripts/**', 'packages/editor-host/src/pipeline/**', 'examples/src/*/scenes/*.json', 'examples/src/*/m2d.project.json', 'package-lock.json') }}
        restore-keys: |
          example-assets-${{ runner.os }}-

    # The compiler's sources, about 3 GB, cached apart from the built set and
    # only when something is to be built; two such entries fit the
    # repository's 10 GB, a third evicts the oldest.
    - name: Restore fetched asset sources
      id: sources
      if: steps.built.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: examples/assets-src
        key: example-sources-${{ runner.os }}-${{ hashFiles('examples/scripts/fetchPolyHaven.mjs', 'examples/scripts/buildPlatformerArt.mjs') }}
        restore-keys: |
          example-sources-${{ runner.os }}-

    # A build that dies partway still leaves work worth keeping: its failure
    # is recorded here and raised after the caches are saved.
    - name: Build missing example assets
      id: build
      shell: bash
      run: npm run build-assets || echo "failed=yes" >> "$GITHUB_OUTPUT"

    # Saved by steps of their own, not `actions/cache`'s post step, which
    # runs only when the whole job succeeds. What a failed build reached is
    # saved under a key the restore-keys still find, so the full key keeps
    # meaning a complete set.
    - name: Name the save
      id: keys
      shell: bash
      env:
        FAILED: ${{ steps.build.outputs.failed }}
      run: |
        if [ "$FAILED" = yes ]; then echo "suffix=-part-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$(ls -A examples/assets-src 2>/dev/null)" ]; then echo "fetched=yes" >> "$GITHUB_OUTPUT"; fi

    - name: Save built example assets
      if: steps.built.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.BUILT_ASSETS }}
        key: ${{ steps.built.outputs.cache-primary-key }}${{ steps.keys.outputs.suffix }}

    - name: Save fetched asset sources
      if: steps.keys.outputs.fetched == 'yes' && steps.sources.outcome == 'success' && steps.sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: examples/assets-src
        key: ${{ steps.sources.outputs.cache-primary-key }}${{ steps.keys.outputs.suffix }}

    - name: Report a failed build
      if: steps.build.outputs.failed == 'yes'
      shell: bash
      run: |
        echo "::error::Building the example assets failed; what it reached is cached for the next run."
        exit 1
